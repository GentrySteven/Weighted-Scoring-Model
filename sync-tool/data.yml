# =============================================================================
# archivesspace-accession-sync Data File
# =============================================================================
# This file is managed by the setup wizard and interactive menu.
# Direct edits are possible for advanced users, but take care to
# preserve proper YAML formatting to avoid syntax errors.
# =============================================================================

scoring_criteria:
  excel_scoring_mode: linked_workbook
  scoring_workbook_path: ''
  dimensions:
    time_in_backlog:
      label: Time in Backlog
      category: quantitative
      weight: 0.5
      source_field: accession_date
      scoring_type: date_range
      thresholds:
      - label: Less than 3 Years
        score: 1
        min_years: 0
        max_years: 3
      - label: 3 - 5 Years
        score: 2
        min_years: 3
        max_years: 5
      - label: 6 - 8 Years
        score: 3
        min_years: 5
        max_years: 8
      - label: 9 or More Years
        score: 4
        min_years: 8
        max_years: null
    priority:
      label: Priority
      category: quantitative
      weight: 0.2
      source_field: processing_priority
      scoring_type: value_map
      mappings:
      - value: Not specified
        score: 1
      - value: Low
        score: 2
      - value: Medium
        score: 3
      - value: High
        score: 4
    subject_descriptors:
      label: Subject Descriptors
      category: strategic
      weight: 0.3
      source_field: subject_descriptor_count
      scoring_type: count_range
      thresholds:
      - label: '1'
        score: 1
        min_count: 1
        max_count: 1
      - label: '2'
        score: 2
        min_count: 2
        max_count: 2
      - label: '3'
        score: 3
        min_count: 3
        max_count: 3
      - label: 4+
        score: 4
        min_count: 4
        max_count: null
