processing_queue:
  queues:
  - name: General Backlog
    status_values:
    - Backlog - General
    grouping_field: Donor Name
    view_mode: indented
backlog_at_a_glance:
  status_groups:
  - label: General Backlog
    status_values:
    - Backlog - General
    show_project_count: true
  - label: Cataloging (Not Part of the Backlog)
    status_values:
    - Cataloging
    show_project_count: false
  - label: Requested
    status_values:
    - Backlog - Requested
    show_project_count: false
  - label: In-Progress
    status_values:
